# Generated by the development repository's publishing tooling from the
# project's declared release artifacts. Edit them there; a change made only
# here is overwritten by the next publish.
#
# Every push to main builds the artifacts and publishes a release tagged
# v<version>, unless that version is already released: raise the version
# to cut a new one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; raise the version to release again."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build-ios-app:
    name: iOS app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: music-ear-trainer
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          npm ci
          npm run build
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$NAME-$VERSION-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: build-ios-app
          path: "*.ipa"
          if-no-files-found: error

  build-android-app:
    name: Android app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: music-ear-trainer
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          npm ci
          npm run build
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME-$VERSION-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: build-android-app
          path: "*.apk"
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build-ios-app, build-android-app]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        run: |
          cat > notes.md <<'NOTES'
          **iOS (unsigned):** `music-ear-trainer-{version}-ios-unsigned.ipa` installs only after you sign it with your own Apple ID (Xcode or a sideloading tool).

          **Android:** `music-ear-trainer-{version}-android-debug.apk` is debug-signed: allow installs from unknown sources, then open it on the device.

          Or use it in the browser at [music-ear-trainer.geoffmyers.com](https://music-ear-trainer.geoffmyers.com).
          NOTES
          sed -i "s/{version}/$VERSION/g" notes.md
          ls -l assets
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes
